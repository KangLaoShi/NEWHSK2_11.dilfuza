      { text: "我到家 ___ 都快9点了。", answer: "时" },
      { text: "他是我 ___ 好的朋友。", answer: "最" },
      { text: "我不舒服时就来这个 ___ 买药。", answer: "药店" },
      { text: "我的 ___ 有点儿疼。", answer: "头" },
      { text: "他的腿受伤了，不能 ___。", answer: "动" },
      { text: "老师站 ___ 上课。", answer: "着" },
      { text: "医生开了些 ___，吃完就好多了。", answer: "药" },
      { text: "外面冷，快请 ___ 来。", answer: "进" },
      { text: "下雪了，在 ___ 小心一点儿。", answer: "路上" },
      { text: "昨天踢足球，今天腿很 ___。", answer: "疼" }
    ];
    const BLANKS_OPTIONS = ["慢", "身体", "经常", "时", "最", "药店", "头", "动", "着", "药", "进", "路上", "疼"];

    // --- STATE MANAGEMENT ---
    let state = {
      activeTab: 'flashcards',
      flashcardIndex: 0,
      flashcardFlipped: false,
      vocabTestQuestions: [],
      vocabTestCurrent: 0,
      vocabTestScore: 0,
      vocabTestSelected: null,
      vocabTestFinished: false,
      grammarAnswers: Array(GRAMMAR_TEST_QUESTIONS.length).fill(null),
      grammarChecked: false,
      blanksAnswers: Array(BLANKS_QUESTIONS.length).fill(""),
      blanksChecked: false
    };

    // --- AUDIO HELPER ---
    function playAudio(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-CN';
        window.speechSynthesis.speak(msg);
      }
    }

    // --- ROUTER / TAB SWITCHER ---
    const TABS = [
      { id: 'flashcards', label: "Lug'atlar" },
      { id: 'vocabTest', label: "Lug'at Testi" },
      { id: 'dialogues', label: "Muloqot" },
      { id: 'grammar', label: "Grammatika" },
      { id: 'grammarTest', label: "Grammatika Testi" },
      { id: 'fillBlanks', label: "So'zlarni to'ldirish" }
    ];

    function initTabs() {
      const container = document.getElementById('tabs-container');
      container.innerHTML = TABS.map(tab => `
        <button id="tab-btn-${tab.id}" onclick="switchTab('${tab.id}')" class="px-5 py-2.5 rounded-full text-sm font-bold transition-all duration-300">
          ${tab.label}
        </button>
      `).join('');
      updateTabStyles();
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      updateTabStyles();
      
      // Special initialization for data-driven modules
      if (tabId === 'vocabTest') {
        resetVocabTest();
      }
      
      renderContent();
    }

    function updateTabStyles() {
      TABS.forEach(tab => {
        const btn = document.getElementById(`tab-btn-${tab.id}`);
        if (!btn) return;
        if (tab.id === state.activeTab) {
          btn.className = "px-5 py-2.5 rounded-full text-sm font-bold transition-all duration-300 bg-teal-600 text-white shadow-lg shadow-teal-900/50 scale-105";
        } else {
          btn.className = "px-5 py-2.5 rounded-full text-sm font-bold transition-all duration-300 bg-slate-800/80 text-slate-400 hover:text-slate-200 hover:bg-slate-700 border border-slate-700/50";
        }
      });
    }

    // --- MODULE GENERATORS ---

    // 1. Flashcards Module
    function renderFlashcards() {
      const word = VOCABULARY[state.flashcardIndex];
      return `
        <div class="flex flex-col items-center w-full mt-8">
          <div class="relative w-full max-w-md h-80 perspective-1000 cursor-pointer" onclick="toggleFlashcardFlip()">
            <div id="flashcard-inner" class="w-full h-full duration-500 preserve-3d relative transition-transform ${state.flashcardFlipped ? 'rotate-y-180' : ''}">
              
              <!-- Front -->
              <div class="absolute w-full h-full backface-hidden flex flex-col items-center justify-center bg-slate-800/80 backdrop-blur-md rounded-2xl border border-slate-700 shadow-2xl p-6">
                 <button onclick="event.stopPropagation(); playAudio('${word.zh}');" class="absolute top-4 right-4 p-2 text-slate-400 hover:text-teal-400 hover:bg-slate-700 rounded-full transition-colors">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                 </button>
                 <h2 class="text-8xl font-bold text-white mb-6">${word.zh}</h2>
              </div>

              <!-- Back -->
              <div class="absolute w-full h-full backface-hidden rotate-y-180 flex flex-col items-center justify-center bg-slate-800/80 backdrop-blur-md rounded-2xl border border-teal-500/30 shadow-2xl p-6 text-center">
                 <button onclick="event.stopPropagation(); playAudio('${word.zh}');" class="absolute top-4 right-4 p-2 text-slate-400 hover:text-teal-400 hover:bg-slate-700 rounded-full transition-colors">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                 </button>
                 <p class="text-4xl text-teal-400 font-semibold mb-6">${word.pinyin}</p>
                 <div class="space-y-3 w-full border-t border-slate-700 pt-6">
                    <p class="text-xl text-slate-200"><span class="text-slate-500 font-medium mr-2">UZ:</span>${word.uz}</p>
                    <p class="text-lg text-slate-300"><span class="text-slate-500 font-medium mr-2">RU:</span>${word.ru}</p>
                    <p class="text-lg text-slate-300"><span class="text-slate-500 font-medium mr-2">EN:</span>${word.en}</p>
                 </div>
              </div>

            </div>
          </div>

          <div class="flex items-center gap-6 mt-8">
            <button onclick="prevFlashcard()" class="p-3 bg-slate-800 text-slate-300 hover:text-white rounded-full hover:bg-slate-700 transition">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <span class="text-slate-400 font-medium text-lg">${state.flashcardIndex + 1} / ${VOCABULARY.length}</span>
            <button onclick="nextFlashcard()" class="p-3 bg-slate-800 text-slate-300 hover:text-white rounded-full hover:bg-slate-700 transition">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
          </div>
        </div>
      `;
    }

    window.toggleFlashcardFlip = function() {
      state.flashcardFlipped = !state.flashcardFlipped;
      renderContent();
    }
    window.nextFlashcard = function() {
      state.flashcardFlipped = false;
      state.flashcardIndex = (state.flashcardIndex + 1) % VOCABULARY.length;
      renderContent();
    }
    window.prevFlashcard = function() {
      state.flashcardFlipped = false;
      state.flashcardIndex = (state.flashcardIndex - 1 + VOCABULARY.length) % VOCABULARY.length;
      renderContent();
    }

    // 2. Vocabulary Test Module (Lug'at Testi)
    function resetVocabTest() {
      let shuffled = [...VOCABULARY].sort(() => 0.5 - Math.random());
      state.vocabTestQuestions = shuffled.map(word => {
        let options = [word.uz];
        while (options.length < 4) {
          let randUz = VOCABULARY[Math.floor(Math.random() * VOCABULARY.length)].uz;
          if (!options.includes(randUz)) options.push(randUz);
        }
        return { word: word, options: options.sort(() => 0.5 - Math.random()) };
      });
      state.vocabTestCurrent = 0;
      state.vocabTestScore = 0;
      state.vocabTestSelected = null;
      state.vocabTestFinished = false;
    }

    function renderVocabTest() {
      if (state.vocabTestFinished) {
        return `
          <div class="flex flex-col items-center justify-center p-10 bg-slate-800/50 rounded-2xl border border-slate-700 max-w-lg mx-auto mt-10">
            <h2 class="text-3xl text-white font-bold mb-4">Natija</h2>
            <p class="text-6xl font-black text-teal-400 mb-8">${state.vocabTestScore} / ${state.vocabTestQuestions.length}</p>
            <button onclick="handleResetVocabTest()" class="px-6 py-3 bg-teal-600 hover:bg-teal-500 text-white rounded-xl font-medium transition flex items-center gap-2">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
              Qayta boshlash
            </button>
          </div>
        `;
      }

      const q = state.vocabTestQuestions[state.vocabTestCurrent];
      if (!q) return '';

      return `
        <div class="flex flex-col items-center w-full mt-6 max-w-xl mx-auto">
          <div class="w-full flex justify-between items-center mb-6 px-4">
            <span class="text-slate-400 font-medium">Savol: ${state.vocabTestCurrent + 1} / ${state.vocabTestQuestions.length}</span>
            <span class="text-teal-400 font-medium">To'g'ri: ${state.vocabTestScore}</span>
          </div>
          
          <div class="w-full bg-slate-800/80 backdrop-blur-md border border-slate-700 rounded-3xl p-10 flex flex-col items-center text-center shadow-xl">
            <p class="text-slate-400 text-lg mb-4">Ushbu so'zning ma'nosini toping:</p>
            <h2 class="text-7xl font-bold text-white mb-10">${q.word.zh}</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
              ${q.options.map((opt, i) => {
                let btnClass = "bg-slate-700 text-slate-200 hover:bg-slate-600";
                if (state.vocabTestSelected !== null) {
                  if (opt === q.word.uz) btnClass = "bg-teal-600 text-white";
                  else if (opt === state.vocabTestSelected) btnClass = "bg-red-500/80 text-white";
                  else btnClass = "bg-slate-800 text-slate-500 opacity-50";
                }
                return `
                  <button onclick="selectVocabOption(${JSON.stringify(opt).replace(/'/g, "&#39;")})" ${state.vocabTestSelected !== null ? 'disabled' : ''} class="py-4 px-6 rounded-xl text-lg font-medium transition-all ${btnClass}">
                    ${opt}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    window.selectVocabOption = function(opt) {
      if (state.vocabTestSelected !== null) return;
      state.vocabTestSelected = opt;
      const q = state.vocabTestQuestions[state.vocabTestCurrent];
      if (opt === q.word.uz) {
        state.vocabTestScore++;
      }
      renderContent();

      setTimeout(() => {
        if (state.vocabTestCurrent + 1 < state.vocabTestQuestions.length) {
          state.vocabTestCurrent++;
          state.vocabTestSelected = null;
        } else {
          state.vocabTestFinished = true;
        }
        renderContent();
      }, 1000);
    }

    window.handleResetVocabTest = function() {
      resetVocabTest();
      renderContent();
    }

    // 3. Dialogues Module (Muloqot)
    function renderDialogues() {
      return `
        <div class="space-y-10 mt-6 max-w-3xl mx-auto pb-10">
          ${DIALOGUES.map((dialogue, idx) => `
            <div class="bg-slate-800/60 backdrop-blur-sm border border-slate-700/50 rounded-2xl overflow-hidden shadow-lg">
              <div class="bg-slate-900/50 px-6 py-4 border-b border-slate-700/50">
                <h3 class="text-xl font-bold text-teal-400 mb-2">${dialogue.title}</h3>
                <div class="text-slate-300 text-sm space-y-1">
                   <p class="text-white text-base mb-1">${dialogue.context.zh} <span class="text-slate-400 text-sm ml-2">(${dialogue.context.pinyin})</span></p>
                   <p><span class="text-slate-500 font-medium">UZ:</span> ${dialogue.context.uz}</p>
                   <p><span class="text-slate-500 font-medium">RU:</span> ${dialogue.context.ru}</p>
                   <p><span class="text-slate-500 font-medium">EN:</span> ${dialogue.context.en}</p>
                </div>
              </div>
              <div class="p-6 space-y-6">
                ${dialogue.lines.map((line, lIdx) => `
                  <div class="flex gap-4">
                    <div class="min-w-[80px] text-right mt-1">
                      <span class="inline-block bg-slate-700 text-slate-200 text-xs font-bold px-2 py-1 rounded">
                        ${line.speaker}
                      </span>
                    </div>
                    <div class="flex-1 space-y-1">
                      <div class="flex items-start justify-between">
                         <div>
                            <p class="text-white font-medium text-lg">${line.zh}</p>
                            <p class="text-teal-400 text-sm mb-2">${line.textPinyin}</p>
                         </div>
                         <button onclick="playAudio('${line.zh}')" class="p-1.5 text-slate-400 hover:text-teal-400 hover:bg-slate-700/50 rounded-full transition">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                         </button>
                      </div>
                      <p class="text-slate-300 text-sm"><span class="text-slate-500 mr-2">UZ:</span>${line.uz}</p>
                      <p class="text-slate-400 text-sm"><span class="text-slate-500 mr-2">RU:</span>${line.ru}</p>
                      <p class="text-slate-400 text-sm"><span class="text-slate-500 mr-2">EN:</span>${line.en}</p>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // 4. Grammar Module (Grammatika)
    function renderGrammar() {
      return `
        <div class="space-y-8 mt-6 max-w-3xl mx-auto pb-10">
          ${GRAMMAR.map((item, idx) => `
            <div class="bg-slate-800/60 backdrop-blur-sm border border-slate-700/50 rounded-2xl p-6 shadow-lg">
              <h3 class="text-2xl font-bold text-teal-400 mb-4">${item.title}</h3>
              
              <div class="space-y-2 mb-6 text-sm">
                <p class="text-slate-200"><span class="text-slate-500 font-semibold w-8 inline-block">UZ:</span> ${item.explanation.uz}</p>
                <p class="text-slate-300"><span class="text-slate-500 font-semibold w-8 inline-block">RU:</span> ${item.explanation.ru}</p>
                <p class="text-slate-300"><span class="text-slate-500 font-semibold w-8 inline-block">EN:</span> ${item.explanation.en}</p>
              </div>

              <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-700/50">
                <h4 class="text-slate-400 font-semibold mb-3 text-sm uppercase tracking-wider">Misollar (Examples)</h4>
                <div class="space-y-4">
                  ${item.examples.map((ex, eIdx) => `
                    <div class="flex flex-col border-l-2 border-teal-500 pl-4">
                       <div class="flex items-center gap-3">
                          <p class="text-white text-lg">${ex.zh}</p>
                          <button onclick="playAudio('${ex.zh}')" class="p-1 text-slate-500 hover:text-teal-400 transition">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                          </button>
                       </div>
                       <p class="text-teal-400/80 text-sm">${ex.pinyin}</p>
                       <p class="text-slate-400 text-sm mt-1">${ex.uz}</p>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // 5. Grammar Test Module (Grammatika Testi)
    function renderGrammarTest() {
      if (state.grammarChecked) {
        let score = 0;
        GRAMMAR_TEST_QUESTIONS.forEach((q, idx) => {
          if (state.grammarAnswers[idx] === q.ans) score++;
        });

        return `
          <div class="max-w-2xl mx-auto mt-6 pb-10">
            <div class="flex flex-col items-center bg-slate-800/80 p-10 rounded-3xl border border-slate-700 text-center shadow-2xl">
              <h2 class="text-3xl text-white font-bold mb-2">Natija (Score)</h2>
              <p class="text-7xl font-black text-teal-400 mb-8">${score} / ${GRAMMAR_TEST_QUESTIONS.length}</p>
              
              <div class="w-full space-y-3 mb-8 text-left">
                 ${GRAMMAR_TEST_QUESTIONS.map((q, idx) => {
                    const isCorrect = state.grammarAnswers[idx] === q.ans;
                    return `
                       <div class="p-4 rounded-lg flex items-start gap-3 ${isCorrect ? 'bg-teal-900/20 border border-teal-800/50' : 'bg-red-900/20 border border-red-800/50'}">
                          <div class="mt-1">
                             ${isCorrect ? 
                               '<svg class="text-teal-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>' : 
                               '<svg class="text-red-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>'}
                          </div>
                          <div>
                             <p class="text-white">${idx + 1}. ${q.q.replace('___', ` [ ${q.options[q.ans]} ] `)}</p>
                             ${!isCorrect ? `<p class="text-red-300 text-sm mt-1">Sizning javobingiz: ${q.options[state.grammarAnswers[idx]] || 'Tanlanmagan'}</p>` : ''}
                          </div>
                       </div>
                    `;
                 }).join('')}
              </div>

              <button onclick="resetGrammarTest()" class="px-8 py-4 bg-teal-600 hover:bg-teal-500 text-white rounded-xl font-bold transition flex items-center gap-2">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                Qayta boshlash
              </button>
            </div>
          </div>
        `;
      }

      return `
        <div class="max-w-2xl mx-auto mt-6 pb-10">
          <div class="space-y-6">
            <div class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl mb-6">
              <p class="text-slate-300">请选择正确的答案填空 (Iltimos, bo'sh joyga to'g'ri javobni tanlang):</p>
            </div>
            ${GRAMMAR_TEST_QUESTIONS.map((q, idx) => `
              <div class="bg-slate-800/60 p-6 rounded-xl border border-slate-700/50">
                <p class="text-xl text-white font-medium mb-4">${idx + 1}. ${q.q}</p>
                <div class="grid grid-cols-2 gap-3">
                  ${q.options.map((opt, oIdx) => `
                    <button onclick="selectGrammarAnswer(${idx}, ${oIdx})" class="p-3 rounded-lg text-lg font-medium transition ${state.grammarAnswers[idx] === oIdx ? 'bg-teal-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}">
                      ${opt}
                    </button>
                  `).join('')}
                </div>
              </div>
            `).join('')}
            <button onclick="submitGrammarTest()" ${state.grammarAnswers.includes(null) ? 'disabled' : ''} class="w-full py-4 rounded-xl text-lg font-bold transition mt-6 ${state.grammarAnswers.includes(null) ? 'bg-slate-700 text-slate-500 cursor-not-allowed' : 'bg-teal-600 hover:bg-teal-500 text-white shadow-lg shadow-teal-900/50'}">
              Tekshirish (Check)
            </button>
          </div>
        </div>
      `;
    }

    window.selectGrammarAnswer = function(qIdx, optIdx) {
      state.grammarAnswers[qIdx] = optIdx;
      renderContent();
    }
    window.submitGrammarTest = function() {
      if (state.grammarAnswers.includes(null)) return;
      state.grammarChecked = true;
      renderContent();
    }
    window.resetGrammarTest = function() {
      state.grammarAnswers = Array(GRAMMAR_TEST_QUESTIONS.length).fill(null);
      state.grammarChecked = false;
      renderContent();
    }

    // 6. Fill in the Blanks Module (So'zlarni to'ldirish)
    function renderFillBlanks() {
      return `
        <div class="max-w-3xl mx-auto mt-6 pb-10">
          <div class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl mb-6">
            <p class="text-slate-300 font-medium mb-4">So'zlarni tanlab gaplarni to'ldiring:</p>
            <div class="flex flex-wrap gap-2">
              ${BLANKS_OPTIONS.map(opt => `<span class="px-3 py-1 bg-slate-700 text-teal-300 rounded-md text-sm border border-slate-600">${opt}</span>`).join('')}
            </div>
          </div>

          <div class="space-y-4">
            ${BLANKS_QUESTIONS.map((q, idx) => {
              const parts = q.text.split('___');
              const isCorrect = state.blanksChecked && state.blanksAnswers[idx] === q.answer;
              const isWrong = state.blanksChecked && state.blanksAnswers[idx] !== q.answer;

              return `
                <div class="bg-slate-800/60 p-5 rounded-xl border flex items-center gap-3 transition ${isCorrect ? 'border-teal-500/50 bg-teal-900/10' : isWrong ? 'border-red-500/50 bg-red-900/10' : 'border-slate-700/50'}">
                  <span class="text-slate-500 font-medium w-6">${idx + 1}.</span>
                  <div class="flex-1 text-lg text-slate-200 flex flex-wrap items-center">
                    <span class="mr-2">${parts[0]}</span>
                    <select onchange="selectBlanksAnswer(${idx}, this.value)" ${state.blanksChecked ? 'disabled' : ''} class="bg-slate-900 border px-3 py-1 rounded-lg text-teal-400 font-bold focus:outline-none appearance-none cursor-pointer ${state.blanksChecked ? 'cursor-not-allowed' : ''} ${isWrong ? 'border-red-500/50' : 'border-slate-600'}">
                      <option value="" ${state.blanksAnswers[idx] === "" ? 'selected' : ''} disabled>-</option>
                      ${BLANKS_OPTIONS.map(o => `<option value="${o}" ${state.blanksAnswers[idx] === o ? 'selected' : ''}>${o}</option>`).join('')}
                    </select>
                    <span class="ml-2">${parts[1]}</span>
                  </div>
                  ${state.blanksChecked && isCorrect ? '<svg class="text-teal-400 ml-auto" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>' : ''}
                  ${state.blanksChecked && isWrong ? '<svg class="text-red-400 ml-auto" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>' : ''}
                </div>
              `;
            }).join('')}
          </div>

          <div class="mt-8 flex gap-4">
             ${!state.blanksChecked ? `
               <button onclick="checkFillBlanks()" ${state.blanksAnswers.includes("") ? 'disabled' : ''} class="flex-1 py-4 rounded-xl text-lg font-bold transition ${state.blanksAnswers.includes("") ? 'bg-slate-700 text-slate-500 cursor-not-allowed' : 'bg-teal-600 hover:bg-teal-500 text-white shadow-lg'}">
                 Tekshirish
               </button>
             ` : `
               <button onclick="resetFillBlanks()" class="flex-1 py-4 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-lg font-bold transition flex justify-center items-center gap-2">
                 <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                 Qayta boshlash
               </button>
             `}
          </div>
        </div>
      `;
    }

    window.selectBlanksAnswer = function(idx, val) {
      state.blanksAnswers[idx] = val;
      // Update check button state dynamically without full re-render if preferred, 
      // but full content render keeps Tailwind sync pristine.
      const btn = document.querySelector('button[onclick="checkFillBlanks()"]');
      if(btn) {
        if(state.blanksAnswers.includes("")) {
          btn.setAttribute('disabled', 'true');
          btn.className = "flex-1 py-4 rounded-xl text-lg font-bold transition bg-slate-700 text-slate-500 cursor-not-allowed";
        } else {
          btn.removeAttribute('disabled');
          btn.className = "flex-1 py-4 rounded-xl text-lg font-bold transition bg-teal-600 hover:bg-teal-500 text-white shadow-lg";
        }
      }
    }
    window.checkFillBlanks = function() {
      if(state.blanksAnswers.includes("")) return;
      state.blanksChecked = true;
      renderContent();
    }
    window.resetFillBlanks = function() {
      state.blanksAnswers = Array(BLANKS_QUESTIONS.length).fill("");
      state.blanksChecked = false;
      renderContent();
    }

    // --- CORE RENDER WRAPPER ---
    function renderContent() {
      const container = document.getElementById('main-content');
      if (state.activeTab === 'flashcards') container.innerHTML = renderFlashcards();
      else if (state.activeTab === 'vocabTest') container.innerHTML = renderVocabTest();
      else if (state.activeTab === 'dialogues') container.innerHTML = renderDialogues();
      else if (state.activeTab === 'grammar') container.innerHTML = renderGrammar();
      else if (state.activeTab === 'grammarTest') container.innerHTML = renderGrammarTest();
      else if (state.activeTab === 'fillBlanks') container.innerHTML = renderFillBlanks();
    }

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      initTabs();
      renderContent();
    });
  </script>
</body>
</html>
